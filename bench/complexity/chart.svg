<text x='62' y='135' font-family='Inter, Helvetica, Arial, sans-serif' font-size='24' fill='#888'>4 drone clips (beach, canyon, coast, tasmania), 30 frames each; no B-frames, lookahead or reordering; PSNR-Y BD-rate against x264 medium</text>
<text x='62' y='167' font-family='Inter, Helvetica, Arial, sans-serif' font-size='24' fill='#888'>x264 tune psnr,zerolatency; x265 tune psnr with the zero-latency settings; hardware HEVC in CQP; VDWT at fixed qp, its rt at matched bitrates</text>
