<text x='1945' y='95' font-family='Inter, Helvetica, Arial, sans-serif' font-size='34' fill='#777' text-anchor='end'>Compression vs encode complexity</text>
<text x='62' y='135' font-family='Inter, Helvetica, Arial, sans-serif' font-size='24' fill='#888'>4 drone clips (canyon, coast, forest, tasmania), 20 frames each, 720p; every tool on: B-frames, lookahead, cutree, scenecut; PSNR-Y BD-rate against x265 medium</text>
<text x='62' y='167' font-family='Inter, Helvetica, Arial, sans-serif' font-size='24' fill='#888'>x265 --tune psnr at its preset defaults; VDWT tiers at their defaults (ultraheavy: P-frames or a B-frame per pair, by a motion-share rule); fixed qp, 3 rates per clip</text>
